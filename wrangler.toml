name = "hema-2026-api"
main = "worker/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Same-origin routes — Pages serves the SPA at the apex, Worker handles
# /api/* and /img/* on the same host so the browser's Access cookie flows
# naturally and there's no CORS overhead.
[[routes]]
pattern = "hema-2026.hsiehting.com/api/*"
zone_name = "hsiehting.com"

[[routes]]
pattern = "hema-2026.hsiehting.com/img/*"
zone_name = "hsiehting.com"

# DB id filled in by scripts/deploy.sh after `wrangler d1 create hema-2026-db`.
[[d1_databases]]
binding = "DB"
database_name = "hema-2026-db"
database_id = "d3dbf212-b061-4716-a16d-fa83a269681e"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "hema-2026-uploads"

# Workers AI (free tier: 10K neurons/day)
[ai]
binding = "AI"

# Optional KV for caching (uncomment after `wrangler kv namespace create CACHE`)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "<REPLACE_ME_KV_ID>"

[vars]
# Set via `wrangler secret put` (see scripts/setup-access.sh) or .dev.vars locally.
# CF_ACCESS_TEAM_DOMAIN = "yourteam.cloudflareaccess.com"
# CF_ACCESS_AUD = "<application audience tag from Access dashboard>"
GH_FEEDBACK_REPO = "htlin222/hema-2026"
ADMIN_EMAILS = "ppoiu87@gmail.com"
# GH_FEEDBACK_TOKEN is a secret — set via:  wrangler secret put GH_FEEDBACK_TOKEN

[observability]
enabled = true

[dev]
port = 8787
