# ──────────────────────────────────────────────────────────────────────────
# Branding for this deployment. Edit when reusing the codebase for a
# different exam — these are the strings that surface in the UI, the
# <head>, and the OpenGraph card.
#
# Q/A bank content lives separately under years/ and scripts/*.csv.
#
# Things NOT covered here (edit alongside this file when forking):
#   • wrangler.toml         — D1 name, R2 bucket, route patterns, GH repo
#   • worker/routes/ai.ts   — exam-domain AI tag-assistant prompt
#   • scripts/*.sh          — DB/bucket names, public-bypass host
# ──────────────────────────────────────────────────────────────────────────

[brand]
# Short title — used in the top nav, boot splash, and the Landing hero.
short_name = "血專衝衝衝"
# Year, rendered next to short_name on the Landing hero.
year = "2026"
# Full title — used for <title>, OG title, Twitter card title.
long_title = "2026 台灣血專衝衝衝"
# Tagline — meta description, OG description, Landing hero subtitle.
subtitle = "血液腫瘤次專科考試 · 共筆詳解 · 全真模擬 · 答案挑戰"
# Shorter tagline shown under the greeting on the home dashboard.
home_subtitle = "2026 台灣血專衝衝衝 · 共筆詳解 · 全真模擬"

[exam]
# When the real exam starts — drives the home-page countdown widget.
# ISO-8601 with timezone offset.
date_iso = "2026-08-29T09:00:00+08:00"
# Human-friendly label shown next to the countdown digits.
date_label = "2026 / 08 / 29 09:00"
# Label above the countdown.
countdown_label = "血液腫瘤次專科考試倒數"

[public]
# Public host (used in OG meta + og-image footer). Should match the
# Worker route patterns in wrangler.toml.
host = "hema-2026.hsiehting.com"
# Small invite-only note rendered at the bottom of the OG card.
og_invite_line = "限 20 位內測使用者 · Cloudflare Zero Trust"

[storage]
# localStorage key for the theme picker — namespaced so forks don't
# collide on the same browser when developing locally.
theme_storage_key = "hema-2026:theme"

[dev]
# Identity the Vite dev proxy injects as X-Dev-Email so the Worker
# (CF_ACCESS_TEAM_DOMAIN === 'localhost') treats local requests as this
# user. Has no effect in production — CF Access supplies the real email.
# The Worker's admin allowlist lives in wrangler.toml [vars] ADMIN_EMAILS.
dev_email = "ppoiu87@gmail.com"
