<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- %CONFIG_*% tokens are substituted at build time from /config.toml
         by the app-config plugin in vite.config.ts. -->
    <title>%CONFIG_TITLE%</title>
    <meta name="description" content="%CONFIG_DESCRIPTION%" />

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%CONFIG_OG_URL%" />
    <meta property="og:title" content="%CONFIG_TITLE%" />
    <meta property="og:description" content="%CONFIG_DESCRIPTION%" />
    <meta property="og:image" content="%CONFIG_OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="zh_TW" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%CONFIG_TITLE%" />
    <meta name="twitter:description" content="%CONFIG_DESCRIPTION%" />
    <meta name="twitter:image" content="%CONFIG_OG_IMAGE%" />
  </head>
  <body class="bg-ink-50 text-ink-800 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
