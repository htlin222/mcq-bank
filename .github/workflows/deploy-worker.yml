name: Deploy Worker (worker-only)

# Auto-deploy the Cloudflare Worker when a merge/push to main touches ONLY
# worker/ files. Mixed changes (frontend/, migrations/, scripts/, config, …)
# are skipped on purpose — anything touching migrations/ especially needs the
# full ./scripts/deploy.sh (which also applies D1 migrations), run by a human.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts:Edit for this account
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
#   WRANGLER_TOML          the full wrangler.toml (gitignored → CI can't deploy
#                          the Worker without it; holds bindings + [vars])

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch: {}

concurrency:
  group: deploy-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff the pushed range

      - name: Guard — only deploy when the push is worker-only
        id: guard
        run: |
          set -euo pipefail
          BEFORE='${{ github.event.before }}'
          AFTER='${{ github.sha }}'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse "${AFTER}~1" 2>/dev/null || echo '')"
          fi
          if [ -n "$BEFORE" ]; then
            CHANGED="$(git diff --name-only "$BEFORE" "$AFTER")"
          else
            CHANGED="$(git show --name-only --pretty=format: "$AFTER")"
          fi
          echo "Changed files in this push:"
          printf '  %s\n' $CHANGED
          if [ -z "$CHANGED" ]; then
            echo "→ no file changes; skipping."
            echo "worker_only=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$CHANGED" | grep -qv '^worker/'; then
            echo "→ non-worker changes present; skipping auto-deploy."
            echo "   Run ./scripts/deploy.sh manually (migrations/config may need it)."
            echo "worker_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "→ worker-only change; will deploy the Worker."
            echo "worker_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore wrangler.toml from secret
        if: steps.guard.outputs.worker_only == 'true'
        env:
          WRANGLER_TOML: ${{ secrets.WRANGLER_TOML }}
        run: |
          set -euo pipefail
          if [ -z "${WRANGLER_TOML:-}" ]; then
            echo "::error::WRANGLER_TOML secret is empty — add it in repo Settings → Secrets and variables → Actions (paste your wrangler.toml)."
            exit 1
          fi
          printf '%s' "$WRANGLER_TOML" > wrangler.toml

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.worker_only == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.worker_only == 'true'
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install worker deps + refresh mcq bundle
        if: steps.guard.outputs.worker_only == 'true'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          # Keep the /mcq .skill download in sync with .claude/skills/mcq/,
          # exactly as ./scripts/deploy.sh does before `wrangler deploy`.
          node scripts/gen-mcq-bundle.mjs

      - name: Deploy Worker
        if: steps.guard.outputs.worker_only == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
