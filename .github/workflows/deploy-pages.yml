name: Deploy Pages (frontend-only)

# Auto-deploy the Cloudflare Pages frontend when a merge/push to main touches
# ONLY frontend/ files. Mixed changes (worker/, migrations/, scripts/, config,
# wrangler.toml, …) are skipped on purpose — those need the full
# ./scripts/deploy.sh (which also deploys the Worker / applies migrations),
# run by a human.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with Pages:Edit for this account
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
#   CONFIG_TOML            the full config.toml (gitignored → CI can't build the
#                          frontend without it; vite reads it at build time)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch: {}

concurrency:
  group: deploy-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff the pushed range

      - name: Guard — only deploy when the push is frontend-only
        id: guard
        run: |
          set -euo pipefail
          BEFORE='${{ github.event.before }}'
          AFTER='${{ github.sha }}'
          # before is unset/zero on first push or force-push, or may be a commit
          # we didn't fetch — fall back to the parent of the new tip.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse "${AFTER}~1" 2>/dev/null || echo '')"
          fi
          if [ -n "$BEFORE" ]; then
            CHANGED="$(git diff --name-only "$BEFORE" "$AFTER")"
          else
            CHANGED="$(git show --name-only --pretty=format: "$AFTER")"
          fi
          echo "Changed files in this push:"
          printf '  %s\n' $CHANGED
          if [ -z "$CHANGED" ]; then
            echo "→ no file changes; skipping."
            echo "pages_only=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$CHANGED" | grep -qv '^frontend/'; then
            echo "→ non-frontend changes present; skipping auto-deploy."
            echo "   Run ./scripts/deploy.sh manually (Worker/migrations may need it)."
            echo "pages_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "→ frontend-only change; will build & deploy Pages."
            echo "pages_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore config.toml + resolve Pages project
        if: steps.guard.outputs.pages_only == 'true'
        env:
          CONFIG_TOML: ${{ secrets.CONFIG_TOML }}
        run: |
          set -euo pipefail
          if [ -z "${CONFIG_TOML:-}" ]; then
            echo "::error::CONFIG_TOML secret is empty — add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$CONFIG_TOML" > config.toml
          echo "PAGES_PROJECT=$(node scripts/lib/cfg.mjs project.pages_project)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.pages_only == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.pages_only == 'true'
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        if: steps.guard.outputs.pages_only == 'true'
        run: |
          set -euo pipefail
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      # 部署前的閘門。2026-07-29 之前，所有 iOS 使用者的題目頁都是整頁白屏，
      # 而 364 個單元測試全綠、Chromium 上完全正常 —— 成因是只在 WebKit 命中的
      # 時序競賽（見 wiki 的 Gotchas 十四）。iOS 強制所有瀏覽器使用 WebKit，
      # 所以少了這一關，同一類「整個平台完全不能用」的失敗沒有任何防線。
      #
      # E2E_REQUIRE=1：瀏覽器沒裝好時要讓 job 失敗，不能靜靜跳過 —— 跳過的
      # 測試看起來跟通過一模一樣，那正是這個閘門要防的事。
      - name: Smoke test on WebKit (iPhone)
        if: steps.guard.outputs.pages_only == 'true'
        env:
          E2E_REQUIRE: '1'
        run: |
          set -euo pipefail
          pnpm --dir frontend exec playwright install --with-deps webkit
          node --test frontend/e2e/smoke.test.mjs

      - name: Deploy to Cloudflare Pages
        if: steps.guard.outputs.pages_only == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ env.PAGES_PROJECT }}
